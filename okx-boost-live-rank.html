<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>OKX Boost 实时排行</title>
<style>
:root{--bg:#0b0d12;--p1:#12151c;--p2:#171b24;--p3:#1e2330;--line:#232837;--line2:#2e3446;--fg:#e9edf5;--sub:#9aa3b5;--dim:#626b7f;
  --acc:#b6f23d;--acc2:#7b61ff;--up:#22c55e;--down:#f43f5e;--warn:#f59e0b;--blue:#60a5fa;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-width:thin;scrollbar-color:#2b3142 transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2b3142;border-radius:8px}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--blue);text-decoration:none}code{background:var(--p3);padding:1px 5px;border-radius:5px;font-size:12px}
.wrap{max-width:1360px;margin:0 auto;padding:16px 18px 60px}
.prog{position:fixed;left:0;right:0;top:0;height:2px;z-index:50}.prog div{height:100%;width:0;background:var(--acc);transition:width .3s}
/* 顶栏 */
.top{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.88);backdrop-filter:blur(12px);margin:0 -18px 14px;padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#0b0d12;display:grid;place-items:center;font-weight:900}
h1{font-size:16px;margin:0;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--p1);color:var(--sub);padding:6px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap;font-family:inherit}
.tab.on{background:var(--fg);color:#0b0d12;border-color:var(--fg)}
.pill{font-size:10px;padding:1px 6px;border-radius:999px;background:rgba(34,197,94,.15);color:var(--up);font-weight:700}.pill.end{background:rgba(244,63,94,.15);color:var(--down)}
.tab.on .pill{background:rgba(0,0,0,.1)}
.tools{display:flex;gap:8px;align-items:center}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}.dot.live{background:var(--up);box-shadow:0 0 0 3px rgba(34,197,94,.18)}.dot.bad{background:var(--down)}
select,input,textarea,.btn{background:var(--p2);color:var(--fg);border:1px solid var(--line2);border-radius:10px;padding:7px 11px;font-size:13px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.btn{cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--acc);color:#0b0d12;border-color:transparent;font-weight:700}.btn.ghost{background:transparent}.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-t{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-t h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.muted{color:var(--sub)}.dim{color:var(--dim)}.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
/* 活动 + 指标 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px;margin-bottom:12px}
.act h2{margin:2px 0 4px;font-size:18px}.act .sub{color:var(--sub);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;color:var(--sub);background:var(--p2);border:1px solid var(--line);padding:2px 9px;border-radius:999px}.chip b{color:var(--fg);font-weight:600}
.cd{display:flex;gap:6px;margin-top:10px}.cd div{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;min-width:50px;text-align:center}
.cd b{font-size:17px;display:block;line-height:1.2}.cd span{font-size:10.5px;color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{color:var(--sub);font-size:12px}.kpi .v{font-size:20px;font-weight:750;margin-top:2px;letter-spacing:-.3px}.kpi .s{color:var(--dim);font-size:11.5px;margin-top:2px}
/* 收藏 */
.favs{margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fc{position:relative;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 16px;cursor:pointer;overflow:hidden}
.fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,#3a4256)}
.fc .h{display:flex;justify-content:space-between;align-items:center;gap:6px}.fc .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc .ad{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--dim);margin-top:1px}
.rkline{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 8px}
.fc .rk{font-size:24px;font-weight:800;letter-spacing:-.5px}.rv{text-align:right}.rv .big{font-size:17px;font-weight:750}.rv .dim{font-size:11.5px}
.g{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}.g span:nth-child(odd){color:var(--sub)}.g span:nth-child(even){text-align:right}
.hint{color:var(--dim);font-size:11.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.fc.total{background:linear-gradient(135deg,rgba(182,242,61,.08),rgba(123,97,255,.06)),var(--p2);border-color:rgba(182,242,61,.25);cursor:default}
.fc.total .rk{color:var(--up)}
.tbadge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--p3);color:var(--tc,var(--sub));white-space:nowrap}
.empty{color:var(--dim);text-align:center;padding:20px 0;font-size:13px}
/* 排行 */
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--sub);padding:4px 9px;border-radius:7px;cursor:pointer;font-size:12px;font-family:inherit}.seg button.on{background:var(--p3);color:var(--fg)}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);cursor:pointer;user-select:none}
.sw input{display:none}.sw i{width:28px;height:16px;border-radius:9px;background:#2b3142;position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#c5cddb;transition:.2s}
.sw input:checked+i{background:var(--acc)}.sw input:checked+i::after{left:14px;background:#0b0d12}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);font-weight:600;font-size:11.5px;text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--p1)}
th.l,td.l{text-align:left}td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr.r td:first-child{box-shadow:inset 3px 0 0 var(--tc,transparent)}tbody tr.r:hover td{background:var(--p2)}
tr.fav td{background:rgba(182,242,61,.05)}
tr.flash td,.mr.flash{animation:fl 2.4s}@keyframes fl{from{background:rgba(96,165,250,.2)}to{background:transparent}}
tr.band td{padding:12px 8px 6px;border-bottom:1px solid var(--line2);text-align:left;background:transparent!important}
.band-l{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}.band-l b{color:var(--tc)}.band-l .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--tc),transparent);opacity:.4}
.rkb{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:7px;background:var(--p3);font-weight:700;font-size:12px}
.rkb.g1{background:#f5c451;color:#231a00}.rkb.g2{background:#cfd6e2;color:#151922}.rkb.g3{background:#d7925d;color:#1f1005}
.addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--fg)}
.star{cursor:pointer;color:#3d4559;font-size:14px;margin-right:6px}.star.on{color:#f5c451}
.delta{font-size:11px;font-weight:700;margin-left:4px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--p3);color:var(--dim);margin-left:6px}
.tag.red{color:var(--down);background:rgba(244,63,94,.1)}.tag.yel{color:var(--warn);background:rgba(245,158,11,.1)}.tag.grn{color:var(--up);background:rgba(34,197,94,.1)}
.tok{font-size:10.5px;padding:1px 6px;border-radius:6px;background:rgba(96,165,250,.12);color:var(--blue);margin-left:6px;font-weight:600;white-space:nowrap}.tok i{font-style:normal;color:var(--dim);font-weight:400;margin-left:3px}
.rdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--down);margin-left:5px;vertical-align:1px}
.news{max-height:62vh;overflow:auto;margin-top:6px}.news .it{padding:12px 0;border-bottom:1px solid var(--line)}.news .it:last-child{border-bottom:0}
.news .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.news .hd b{font-size:14px}.news .hd .new{font-size:10.5px;padding:1px 6px;border-radius:6px;background:rgba(244,63,94,.15);color:var(--down);font-weight:700}
.news .hd .kind{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--p3);color:var(--sub)}.news .hd .kind.n{background:rgba(245,158,11,.12);color:var(--warn)}
.news ul{margin:0;padding-left:18px;color:var(--sub);font-size:13px;line-height:1.75}.news ul b{color:var(--fg);font-weight:600}.news p{margin:0;color:var(--sub);font-size:13px;line-height:1.75;white-space:pre-wrap}
.vsw{display:inline-flex;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:2px}.vsw button{border:0;background:transparent;color:var(--sub);padding:5px 11px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:700}.vsw button.on{background:var(--fg);color:#0b0d12}.vsw i{font-style:normal;font-size:11px;font-weight:600;margin-left:2px;color:var(--warn)}
.cltag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:rgba(123,97,255,.16);color:#b4a6ff;margin-left:6px;cursor:pointer;white-space:nowrap}.cltag.b{background:rgba(245,158,11,.12);color:var(--warn)}
.clbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--sub)}
.clg{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--p2)}.clg.focus{border-color:#7b61ff;box-shadow:0 0 0 2px rgba(123,97,255,.25)}
.clh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px;cursor:pointer}.clh b{font-size:14px}.clh .st{display:flex;gap:14px;margin-left:auto;font-size:12.5px;color:var(--sub);flex-wrap:wrap}.clh .st b{color:var(--fg);font-size:13px}
.clev{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}.clev span{font-size:11.5px;padding:2px 8px;border-radius:7px;background:var(--p3);color:var(--sub)}.clev span b{color:var(--fg);font-weight:600}
.hide{display:none!important}
.clm{border-top:1px solid var(--line);padding:4px 14px 8px}.clm table td{padding:6px 6px}.clnm{font-size:13px;color:var(--acc);font-weight:700}.cled{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:13px;padding:0 4px}.cled:hover{color:var(--fg)}
.lv{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px}.lv.h{background:rgba(244,63,94,.15);color:var(--down)}.lv.m{background:rgba(245,158,11,.14);color:var(--warn)}.lv.l{background:var(--p3);color:var(--sub)}
.dcd{background:linear-gradient(135deg,rgba(182,242,61,.08),rgba(123,97,255,.06));border:1px solid rgba(182,242,61,.25);border-radius:12px;padding:10px 12px;margin-top:10px}.dcd .cd{margin-top:6px}.dcd .cd b{color:var(--acc)}.dcd-h{font-size:13px}.dbar{height:4px;border-radius:3px;background:var(--p3);margin-top:8px;overflow:hidden}.dbar i{display:block;height:100%;background:var(--acc)}
.lbl{font-size:11px;color:var(--acc);margin-left:6px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.pgs{display:flex;gap:4px;flex-wrap:wrap}.board{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;width:100%;order:3}.board:empty{display:none}.board button{border:1px solid var(--line);background:var(--p2);color:var(--sub);padding:4px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px;white-space:nowrap}.board button.on{background:var(--acc);color:#0b0d12;border-color:transparent;font-weight:700}.board button:disabled{opacity:.35;cursor:default}.board .now{font-size:10px;margin-left:4px;color:var(--up)}.board button.on .now{color:#0b0d12}.pgjump{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}.pgs button{min-width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--p2);color:var(--sub);cursor:pointer;font-family:inherit}
.pgs button.on{background:var(--acc);color:#0b0d12;border-color:transparent;font-weight:700}.pgs button:disabled{opacity:.4}
#mlist{display:none}
.side{display:flex;flex-direction:column;gap:12px}.side h3{margin:0 0 10px;font-size:14px}
.tiers{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;font-size:12.5px;align-items:center}.tiers .sw2{width:8px;height:8px;border-radius:3px}.tiers b{font-weight:600;text-align:right}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--sub)}.kv b{color:var(--fg);font-weight:600}
.feed .it{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.sb{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px}.b-buy{background:rgba(34,197,94,.14);color:var(--up)}.b-sell{background:rgba(244,63,94,.14);color:var(--down)}
.note{margin-top:16px;color:var(--dim);font-size:12px;line-height:1.8}.note b{color:var(--sub)}
.proxybox{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--sub);line-height:1.8}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:50px 14px;overflow:auto}
.mask.on{display:flex}.modal{width:min(720px,100%);background:var(--p1);border:1px solid var(--line2);border-radius:18px;padding:20px}
.modal h3{margin:0 0 6px;font-size:16px}.modal textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;margin:10px 0;resize:vertical}
.flist{margin-top:12px;border-top:1px solid var(--line)}
.flist .fi{display:grid;grid-template-columns:1fr 160px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.flist .fi input{padding:5px 9px;min-width:0}
.mfoot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
/* 平板 */
@media(max-width:1100px){.main{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}
/* 手机：只保留关键内容 */
@media(max-width:760px){
  .top .status{order:5;width:100%;font-size:11.5px}
  .wrap{padding:0 10px 40px}.top{margin:0 -10px 10px;padding:8px 10px;gap:8px}
  h1{font-size:15px}.hide-m,.status .txt2,#odot,#iv,#pause,#csv,#offCard,.side>.card:last-child,.note,#favOther,.act .sub,.act .chips:last-of-type{display:none!important}
  .main>.side{order:-1;display:block;margin:0}.side .card{margin-bottom:0}.tiers{font-size:12px}
  .mstat{display:flex!important}
  .tools{gap:6px}.btn{padding:6px 10px}
  .card{padding:12px;border-radius:12px}.act h2{font-size:16px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpi:nth-child(n+5){display:none}.kpi{padding:10px 12px}.kpi .v{font-size:17px}.kpi .s{display:none}
  .fgrid{grid-template-columns:1fr}
  .tw{display:none}#mlist{display:block}
  .sec-t .toolbar{width:100%}.sec-t .toolbar input{flex:1;min-width:0}
  .mband{font-size:12px;color:var(--sub);padding:12px 2px 4px;border-bottom:1px solid var(--line2)}.mband b{color:var(--tc);margin-right:6px}
  .mr{padding:10px 2px;border-bottom:1px solid var(--line)}.mr.fav{background:rgba(182,242,61,.05)}
  .m1{display:flex;align-items:center;gap:10px}.m2{flex:1;min-width:0;font-size:12.5px}.m2 .dim{font-size:12px}.m3{text-align:right;font-size:13px;font-weight:700}
  .flist .fi{grid-template-columns:1fr 1fr;}.flist .fi>div{grid-column:1/-1}
  .pager select{display:none}
}
</style>
</head>
<body>
<div class="prog"><div id="prog"></div></div>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">B</div><h1>OKX Boost 排行</h1></div>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <div class="status"><span class="dot" id="dot"></span><span id="stat">初始化…</span><span class="dot" id="odot"></span><span id="ostat" class="txt2">官方接口</span></div>
      <select id="iv" title="刷新间隔"><option value="8">8s</option><option value="15" selected>15s</option><option value="30">30s</option><option value="60">60s</option></select>
      <button class="btn" id="pause">暂停</button>
      <button class="btn" id="verBtn" title="更新公告"><span id="verTxt">v</span><i class="rdot hide" id="verDot"></i></button>
      <button class="btn hide" id="mgrBtn" style="display:none">☰ 活动</button>
      <button class="btn" id="csv">导出</button>
    </div>
  </div>

  <div class="hero"><div class="card act" id="actCard"></div><div class="kpis" id="kpis"></div></div>

  <div class="card favs">
    <div class="sec-t"><h3>⭐ 我的账号 <span class="muted" id="favSum" style="font-weight:400;font-size:12px"></span></h3>
      <div class="toolbar"><span id="favOther"></span><button class="btn sm" id="favRefresh">刷新</button><button class="btn sm pri" id="favMgr">管理账号</button></div></div>
    <div class="fgrid" id="favGrid"></div>
  </div>

  <div class="main">
    <div class="card">
      <div class="sec-t">
        <h3><span class="vsw" id="viewSw"><button data-v="rank" class="on">排行榜</button><button data-v="cl">疑似关联 <i id="clN"></i></button></span> <span class="muted" style="font-weight:400;font-size:12px" id="rankInfo"></span></h3>
        <div class="board" id="board"></div>
        <div class="toolbar">
          <label class="sw"><input type="checkbox" id="onlyFav"><i></i>只看收藏</label>
          <label class="sw hide-m"><input type="checkbox" id="bands" checked><i></i>阶梯</label>
          <div class="seg hide-m" id="win"></div>
          <input id="q" placeholder="搜索地址 / 备注" style="width:170px">
        </div>
      </div>
      <div id="clview" class="hide"></div>
      <div id="rkview"><div class="tw"><table><thead id="th"></thead><tbody id="tbody"></tbody></table></div>
      <div id="mlist"></div>
      <div class="pager"><span class="muted" style="font-size:12px" id="pgInfo"></span><div class="pgs" id="pgs"></div><span class="pgjump">跳至 <input id="pgGo" type="number" min="1" style="width:64px;padding:4px 6px"> 页</span>
        <select id="ps"><option value="25">25 / 页</option><option value="50" selected>50 / 页</option><option value="100">100 / 页</option><option value="200">200 / 页</option></select></div></div>
    </div>

function applyClaims(A,C){ // 领奖记录 = 官方最终奖励：按金额排序即官方名次，交易量可精确反推

}

const getJ=async u=>{ const r=await fetch(BASE+u,{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); };

function idx(A,addr){ if(!A.ai.has(addr)){A.ai.set(addr,A.addrs.length);A.addrs.push(addr);} return A.ai.get(addr); }

function applyBankBoard(list,ut,participants,total,B){ const cur100=new Set(list.map(x=>x[0])); for(const [i,o] of B.off) if(!o.claim&&o.r>0&&!cur100.has(B.addrs[i])) o.r=null; // 以前上过前 100、现在掉出的：仍算已报名，但名次改为估算
  for(const [addr,r,v,est] of list){ const i=idx(B,addr); B.off.set(i,{r,v,ut,est}); B.unreg.delete(i); }

    if(P.length>=5){ const mx=P.reduce((t,p)=>t+p[0],0)/P.length, my=P.reduce((t,p)=>t+p[1],0)/P.length;
      const k=P.reduce((t,p)=>t+(p[0]-mx)*(p[1]-my),0)/(P.reduce((t,p)=>t+(p[0]-mx)**2,0)||1), base=my-k*mx;
      if(base>0&&k>0){ B.offMeta.N=Math.min(B.pool.max,Math.round(B.pool.base/base)); B.offMeta.Tw=B.pool.bonus/k; } } }

}

/* ================= RPC ================= */
async function rpc(A,method,params){
  let err; for(let t=0;t<A.rpcs.length*3;t++){ const url=A.rpcs[A.rpcI%A.rpcs.length];
    try{ const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});
      if(r.status===429){A.rpcI++;await sleep(700*(t+1));continue;}
      const j=await r.json(); if(j.error) throw new Error(j.error.message||JSON.stringify(j.error)); return j.result;
    }catch(e){err=e;A.rpcI++;await sleep(250);} }
  throw err;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function logs(A,a,b){ try{
    if(A.lev){ const L=await rpc(A,"eth_getLogs",[{fromBlock:"0x"+a.toString(16),toBlock:"0x"+b.toString(16),address:[A.router,A.lev]}]);
      const lv=new Set(L.filter(l=>l.address.toLowerCase()===A.lev).map(l=>l.transactionHash));
      return L.filter(l=>lv.has(l.transactionHash)&&l.address.toLowerCase()===A.router&&[ORDER,COMM_FROM,COMM_TO].includes(l.topics[0])); }
    const L1=await rpc(A,"eth_getLogs",[{fromBlock:"0x"+a.toString(16),toBlock:"0x"+b.toString(16),address:A.router,topics:[[ORDER,COMM_FROM,COMM_TO]]}]);
    if(!A.relayer) return L1;
    return L1.concat(await rpc(A,"eth_getLogs",[{fromBlock:"0x"+a.toString(16),toBlock:"0x"+b.toString(16),address:A.relayer,topics:[[RL_SWAP,RL_FEE,RL_GAS]]}]));}
  catch(e){ if(b-a<20) throw e; const m=(a+b)>>1; return (await logs(A,a,m)).concat(await logs(A,m+1,b)); } }
function decodeRelayer(A,ls){ // 代付 Gas 交易：用户地址在事件里，手续费和代付 Gas 费从计价币里扣
  const w=(d,i)=>d.slice(2+64*i,2+64*(i+1)), ad=x=>"0x"+x.slice(-40), fee={}, gas={}, out=[];
  for(const l of ls) if(l.topics[0]===RL_FEE||l.topics[0]===RL_GAS){ const t=ad(l.topics[1]), m=l.topics[0]===RL_FEE?fee:gas; m[t]=(m[t]||0n)+BigInt("0x"+w(l.data,2)); }
  for(const l of ls){ if(l.topics[0]!==RL_SWAP||l.topics.length<4) continue; const user=ad(l.topics[1]), ft=ad(l.topics[2]), tt=ad(l.topics[3]);
    const fa=BigInt("0x"+w(l.data,0)), ra=BigInt("0x"+w(l.data,1)); let ti,q,ta,buy,qa;
    if(A.tokIdx.has(ft)&&A.quotes[tt]){ ti=A.tokIdx.get(ft); qa=tt; buy=0; ta=Number(fa)/10**A.tokens[ti].d; q=Number(ra)/10**A.quotes[tt][1]; }
    else if(A.tokIdx.has(tt)&&A.quotes[ft]){ ti=A.tokIdx.get(tt); qa=ft; buy=1; q=Number(fa)/10**A.quotes[ft][1]; ta=Number(ra)/10**A.tokens[ti].d; }
    else continue; const qd=A.quotes[qa][1];
    out.push({a:idx(A,user),b:parseInt(l.blockNumber,16),qk:A.quotes[qa][0]==="usd"?0:1,q,t:ti,ta,buy,f:Number(fee[qa]||0n)/10**qd,g:Number(gas[qa]||0n)/10**qd,h:l.transactionHash}); }
  return out; }
function decodeTx(A,ls){ // 一笔交易里的 OrderRecord + 手续费事件
  if(A.relayer&&ls.some(l=>l.address.toLowerCase()===A.relayer)) return decodeRelayer(A,ls);
  const w=(d,i)=>d.slice(2+64*i,2+64*(i+1)), ad=x=>"0x"+x.slice(24), out=[];
  for(const l of ls){ if(l.topics[0]!==ORDER) continue; const d=l.data, li=parseInt(l.logIndex,16);
    const ft=ad(w(d,0)), tt=ad(w(d,1)), snd=ad(w(d,2)); let fa=BigInt("0x"+w(d,3)), ra=BigInt("0x"+w(d,4));
    let cfa=0n,cta=0n; const oi=ls.filter(m=>m.topics[0]===ORDER).map(m=>parseInt(m.logIndex,16));
    const prev=Math.max(-1,...oi.filter(x=>x<li)), nxt=Math.min(1e9,...oi.filter(x=>x>li));
    for(const m of ls){ const lj=parseInt(m.logIndex,16), tok=ad(w(m.data,0)); // 多条手续费事件（OKX + 推荐/渠道）全部累加
      const own=(prev<lj&&lj<li)||(li<lj&&lj<nxt&&nxt===1e9&&m.topics[0]===COMM_TO); if(!own) continue;
      if(m.topics[0]===COMM_FROM&&tok===ft) cfa+=BigInt("0x"+w(m.data,1));
      if(m.topics[0]===COMM_TO&&tok===tt) cta+=BigInt("0x"+w(m.data,1)); }
    let ti,q,ta,buy,fee,qa;
    if(A.tokIdx.has(ft)&&A.quotes[tt]){ ti=A.tokIdx.get(ft); qa=tt; const qd=A.quotes[tt][1], td=A.tokens[ti].d; buy=0;
      ta=Number(fa+cfa)/10**td; q=Number(ra)/10**qd; fee=Number(cfa)/10**td*(ta?q/ta:0)+Number(cta)/10**qd; }
    else if(A.tokIdx.has(tt)&&A.quotes[ft]){ ti=A.tokIdx.get(tt); qa=ft; const qd=A.quotes[ft][1], td=A.tokens[ti].d; buy=1;
      q=Number(fa+cfa)/10**qd; ta=Number(ra)/10**td; fee=Number(cfa)/10**qd+(ra+cta>0n?Number(cta)/10**td*(Number(fa)/10**qd)/(Number(ra+cta)/10**td):0); }
    else continue;
    out.push({a:idx(A,snd),b:parseInt(l.blockNumber,16),qk:A.quotes[qa][0]==="usd"?0:1,q,t:ti,ta,buy,f:fee,h:l.transactionHash}); }
  return out; }

async function poll(A,ui){
  if(A.offOnly){ A.headTs=A.head=Math.floor(Date.now()/1000); return; }
  if(A.done||(A.snap&&A.snap.endTs>=A.endTs)){ A.final=true; return; }
  if(A.busy||paused||!A.rpcs) return; A.busy=true;
  try{
    const head=parseInt(await rpc(A,"eth_blockNumber",[]),16);
    if(head-A.next>1800/A.blockTime&&A.headTs<A.endTs+600){ A.busy=false; if(A.key===cur) setStat(false,`服务器同步中 ${SRV.status[A.key]||""}`); await loadConfigSoft(); await loadData(A); if(A.key===cur) render(); return; }
    const blk=await rpc(A,"eth_getBlockByNumber",["0x"+head.toString(16),false]); A.head=head; A.headTs=parseInt(blk.timestamp,16);
    if(A.headTs>A.endTs&&A.endBlock===null) A.endBlock=head-Math.round((A.headTs-A.endTs)/A.blockTime);
    const to=A.endBlock!==null?Math.min(head,A.endBlock):head, from=A.next, total=to-from+1, big=total>A.range*6;
    for(let a=from;a<=to;){ const batch=[]; for(let i=0;i<(A.range<=100?4:2)&&a<=to;i++){const b=Math.min(a+A.range-1,to);batch.push([a,b]);a=b+1;}
      const res=await Promise.all(batch.map(([x,y])=>logs(A,x,y)));
      for(const L of res){ const g=new Map(); for(const l of L){ if(!g.has(l.transactionHash)) g.set(l.transactionHash,[]); g.get(l.transactionHash).push(l); } for(const ls of g.values()) for(const o of decodeTx(A,ls)){ addOrder(A,o); A.live++; if(!big||to-o.b<200/A.blockTime){A.feed.unshift(o);A.flash.add(o.a);} if(!A.checked.has(o.a)) offQueue(A,o.a); } }
      A.next=batch[batch.length-1][1]+1;
      if(big&&ui){ $("prog").style.width=((A.next-from)/total*100).toFixed(1)+"%"; setStat(false,`追赶区块 ${((A.next-from)/total*100).toFixed(0)}%`); }
    }
    A.feed=A.feed.slice(0,60); $("prog").style.width="0";
    if(A.key===cur){ render(); setStat(true,`${A.chain} #${A.head.toLocaleString()} · ${new Date(A.headTs*1000).toLocaleTimeString("zh-CN",{hour12:false})}`); setTimeout(()=>A.flash.clear(),2500); }
  }catch(e){ if(A.key===cur) setStat(false,"链上同步失败，重试中"); }
  finally{ A.busy=false; }
}

function applyChangelog(o){ if(!o) return; const del=new Set(o.deleted||[]), m=new Map(CL_BUILTIN.map(c=>[c.v,c]));
  for(const c of o.items||[]) m.set(c.v,{v:c.v,d:c.d,items:c.items.map(x=>esc(x)),edited:true});
  const arr=[...m.values()].filter(c=>!del.has(c.v)).sort((a,b)=>verCmp(b.v,a.v)); CHANGELOG.length=0; CHANGELOG.push(...arr); }
async function loadNews(auto){
  try{ const j=await getJ("api/notices"); NOTICES=j.notices||[]; applyChangelog(j.changelog); if(j.page&&verCmp(j.page,APP_VERSION)>0){ NOTICES.unshift({id:"reload"+j.page,ts:Date.now()/1000,title:`新版本 v${j.page} 已发布`,body:"请刷新页面加载新版本。",pin:true}); } }catch(e){}
  if(LS.get("okxSeenVer",null)==null&&localStorage.getItem("okxAct")) LS.set("okxSeenVer","4.0");   // 老用户：从 4.0 之后的更新开始提醒
  const seenV=LS.get("okxSeenVer",null), seenN=new Set(LS.get("okxSeenNotice",[]));
  const newV=CHANGELOG.filter(c=>!seenV||verCmp(c.v,seenV)>0), newN=NOTICES.filter(n=>!seenN.has(n.id));
  $("verTxt").textContent="v"+APP_VERSION; $("verDot").classList.toggle("hide",!(newV.length||newN.length));
  if(!seenV){ LS.set("okxSeenVer",APP_VERSION); }        // 第一次访问的新用户：不弹历史公告，只提醒未读的管理员公告
  if(auto&&(seenV?(newV.length||newN.length):newN.length)) showNews(seenV?newV:[],newN);
}
function showNews(newV,newN){
  const nv=new Set((newV||[]).map(c=>c.v)), nn=new Set((newN||[]).map(n=>n.id));
  const items=[...NOTICES.map(n=>({k:"n",t:n.ts,html:`<div class="it"><div class="hd"><span class="kind n">公告</span><b>${esc(n.title)}</b>${nn.has(n.id)?'<span class="new">NEW</span>':""}<span class="dim" style="font-size:12px">${new Date(n.ts*1000).toLocaleDateString("zh-CN")}</span></div>${n.body?`<p>${esc(n.body)}</p>`:""}</div>`})),
    ...CHANGELOG.map(c=>({k:"v",t:Date.parse(c.d)/1000,html:`<div class="it"><div class="hd"><span class="kind">版本更新</span><b>v${c.v}</b>${nv.has(c.v)?'<span class="new">NEW</span>':""}<span class="dim" style="font-size:12px">${c.d}</span></div><ul>${c.items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`}))];
  // 未读的排最前，其余按时间倒序
  items.sort((a,b)=>b.t-a.t); const unread=items.filter(x=>x.html.includes('class="new"')), rest=items.filter(x=>!x.html.includes('class="new"'));
  $("newsBody").innerHTML=[...unread,...rest].map(x=>x.html).join(""); $("newsVer").textContent=`当前版本 v${APP_VERSION}`; $("newsMask").classList.add("on"); }
function markNewsRead(){ LS.set("okxSeenVer",(CHANGELOG[0]||{v:APP_VERSION}).v); LS.set("okxSeenNotice",[...new Set([...LS.get("okxSeenNotice",[]),...NOTICES.map(n=>n.id)])].slice(-200)); $("verDot").classList.add("hide"); }
$("verBtn").onclick=()=>{ showNews([],[]); markNewsRead(); };
$("newsClose").onclick=()=>{ $("newsMask").classList.remove("on"); markNewsRead(); };

/* ================= 活动管理 / 启动 ================= */
async function loadConfigSoft(){ try{ const j=await getJ("api/activities"); SRV.status=j.status||{}; for(const c of j.acts||[]) if(ACTS[c.key]) ACTS[c.key].endTs=c.endTs; }catch(e){} }
function trackFavs(){ for(const A of Object.values(ACTS)) if(A.offOnly&&favs.length) fetch(BASE+"api/track",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({key:A.key,addrs:favs.map(f=>f.a)})}).catch(()=>{}); }
async function post(u,b){ b.pass=$("mgrPass").value||LS.get("okxAdmin",""); const r=await fetch(BASE+u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}); const j=await r.json(); if(j.ok&&$("mgrPass").value) LS.set("okxAdmin",$("mgrPass").value); return j; }
function openMgr(){ $("mgrPassRow").style.display=SRV.admin?"flex":"none"; $("mgrPass").value=LS.get("okxAdmin","");
  const now=Date.now()/1000;
  $("mgrList").innerHTML=CFG.slice().sort((a,b)=>b.startTs-a.startTs).map(c=>`<div class="fi" style="grid-template-columns:1fr auto auto"><span><b>${esc(c.short||c.name)}</b> <span class="dim">${c.chain} · ${now>c.endTs?"已结束":"进行中"}${SRV.status[c.key]?" · "+SRV.status[c.key]:""}</span></span>
    <label class="sw"><input type="checkbox" data-h="${c.key}" ${c.hidden?"":"checked"}><i></i>显示</label><button class="btn sm ghost" data-r="${c.key}" style="color:var(--down)">删除</button></div>`).join("")||`<div class="empty">还没有活动</div>`;
  document.querySelectorAll("#mgrList input[data-h]").forEach(el=>el.onchange=async()=>{ const j=await post("api/hide",{key:el.dataset.h,hidden:!el.checked}); if(!j.ok){$("mgrMsg").innerHTML=`<span class="down">${j.msg}</span>`;return;} await reloadAll(); openMgr(); });
  document.querySelectorAll("#mgrList button[data-r]").forEach(b=>b.onclick=async()=>{ if(!confirm("删除后需要重新添加并重新统计，确定？")) return; const j=await post("api/remove",{key:b.dataset.r}); if(!j.ok){$("mgrMsg").innerHTML=`<span class="down">${j.msg}</span>`;return;} await reloadAll(); openMgr(); });
  $("mgrMask").classList.add("on");
  $("mgrDiag").innerHTML=`<span class="dim">服务器网络检测中…</span>`; getJ("api/diag").then(d=>{ $("mgrDiag").innerHTML="<b>服务器网络</b>："+Object.entries(d).map(([k,v])=>`<span class="${/^OK/.test(v)?"up":"down"}">${esc(k)} ${esc(v)}</span>`).join(" · "); }).catch(()=>{$("mgrDiag").textContent="";}); }
async function reloadAll(){ await loadConfig(); if(!ACTS[cur]) cur=pickCur(); render(); for(const k in ACTS) poll(ACTS[k],k===cur); }
function pickCur(){ const v=Object.values(ACTS); const live=v.filter(A=>Date.now()/1000<A.endTs).sort((a,b)=>b.startTs-a.startTs); return (live[0]||v[0]||{}).key; }
$("mgrBtn").onclick=openMgr; $("mgrClose").onclick=()=>$("mgrMask").classList.remove("on");
$("mgrAdd").onclick=async()=>{ const u=$("mgrUrl").value.trim(); if(!u) return; $("mgrMsg").textContent="正在读取活动信息…（约 10–30 秒）"; $("mgrAdd").disabled=true;
  try{ let j=await post("api/add",{url:u}).catch(e=>({ok:false,msg:"NEED_STATE:"+e.message}));
    
    if(!j.ok) throw new Error((j.msg||"").replace("NEED_STATE:","")); $("mgrMsg").innerHTML=`<span class="up">已添加，服务器开始统计。进行中的活动首次同步可能需要几分钟到几十分钟。</span>`; $("mgrUrl").value=""; await reloadAll(); cur=j.key; LS.set("okxAct",cur); render(); openMgr(); }
  catch(e){ $("mgrMsg").innerHTML=`<span class="down">添加失败：${esc(e.message||e)}</span>`; } finally{ $("mgrAdd").disabled=false; } };
function noServer(msg){ $("actCard").innerHTML=`<h2>无法连接服务端</h2><div class="sub">${msg}<br>请用 <code>python3 okx_boost_server.py</code> 启动后，通过 http://服务器地址:8787 打开本页。</div>`; }
(async()=>{ bridgePing(); setTimeout(bridgePing,1500); showProxy(); setTimeout(()=>loadNews(true),1200); setInterval(()=>loadNews(false),300000);
  try{ await loadConfig(); }catch(e){ noServer("读取 /api/activities 失败。"); return; }
  cur=ACTS[cur]?cur:pickCur(); await loadPrior(); await prices(); await priceHistory();
  if(!cur){ tabs(); $("actCard").innerHTML=`<h2>还没有显示中的活动</h2><div class="sub">点右上角「☰ 活动管理」粘贴 OKX 活动链接添加。</div>`; return; }
  render(); trackFavs(); poll(ACTS[cur],true).then(()=>{ for(const k in ACTS) if(k!==cur) poll(ACTS[k],false); }); schedule(); officialTick(); setTimeout(gasScan,4000); setTimeout(solScan,3000); setInterval(solScan,90000);
  setInterval(loadConfigSoft,60000); const ping=()=>fetch(BASE+"api/ping",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({act:cur})}).catch(()=>{}); ping(); setInterval(ping,60000);
  setInterval(async()=>{ if(document.hidden) return; const A=ACTS[cur]; if(A&&!A.offOnly){ await loadData(A); render(); } },600000);   // 只重新拉取当前活动的完整数据
  setInterval(async()=>{ for(const A of Object.values(ACTS)) if(A.offOnly){ try{ loadOff(A,await getJ(`data/${A.key}_off.json`)); }catch(e){} } render(); },120000);
})();
</script>
